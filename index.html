body{background:#061225}
#brand-screen{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;overflow:hidden;color:#f3f8ff;font-family:system-ui,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 35%,rgba(44,135,255,.23),transparent 38%),radial-gradient(ellipse at 80% 82%,rgba(255,133,63,.18),transparent 32%),linear-gradient(145deg,#061225,#0a1e40 58%,#071225);animation:rl2-intro 4.6s cubic-bezier(.6,0,.8,1) forwards;pointer-events:none}

.rl2-splash__mark b{position:absolute;right:-9px;bottom:-8px;display:grid;place-items:center;width:27px;height:27px;border:2px solid #ffe2c9;border-radius:9px;background:linear-gradient(135deg,#ffb16f,#f26836);color:#14223a;font-size:15px;box-shadow:0 4px 14px rgba(255,115,54,.34)}
.rl2-splash__wordmark{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:clamp(30px,7vw,58px);font-weight:950;letter-spacing:.045em;line-height:.9;text-shadow:0 5px 22px rgba(27,147,255,.22)}

.rl2-splash__status{display:flex;align-items:center;gap:9px;margin-top:6px;color:#d3e5fa;font-size:11px;font-weight:800;letter-spacing:.19em}
.rl2-splash__status span{width:7px;height:7px;border-radius:50%;background:#54dcff;box-shadow:0 0 12px #54dcff}

.rl2-splash__track i{display:block;width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#28b8ff,#bcecff 58%,#ff9855);animation:rl2-progress 1.3s ease-in-out infinite alternate}
.rl2-splash__tagline{color:rgba(207,225,247,.66);font-size:10px;font-weight:700;letter-spacing:.21em}

.title-block__maker strong{background:linear-gradient(95deg,#77dfff 0%,#f5fbff 48%,#ffad70 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:950}
