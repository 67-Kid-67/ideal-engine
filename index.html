  <body>
    <div id="app"></div>
    <div id="brand-screen" aria-hidden="false">
      <div class="rl2-splash__panel">
        <p class="rl2-splash__eyebrow">THE ARENA IS YOURS</p>
        <h1 class="rl2-splash__wordmark">ROCKET<br /><span>LEAGUE 2</span></h1>
        <p class="rl2-splash__hook">DRIVE FAST. FLY HIGH. FIND THE NET.</p>
        <div class="rl2-splash__status"><span></span> PREPARING THE ARENA</div>
        <div class="rl2-splash__track"><i></i></div>
        <p class="rl2-splash__status" id="rl2-splash-message" role="status">LOADING YOUR ARENA…</p>
        <button type="button" id="rl2-splash-retry" hidden>Reload game</button>
      </div>
    </div>
    <script>
      (() => {
        const splash = document.querySelector("#brand-screen");
        const message = document.querySelector("#rl2-splash-message");
        const retry = document.querySelector("#rl2-splash-retry");
        const dismiss = () => splash.classList.add("is-ready");
        const update = () => {
          if (document.querySelector("#loading") || document.querySelector("#app canvas")) {
            dismiss();
            return true;
          }
          return false;
        };
        retry.addEventListener("click", () => window.location.reload());
        const observer = new MutationObserver(update);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        update();
        window.addEventListener("vite:preloadError", () => {
          message.textContent = "A game file failed to load. Check your connection and reload.";
          retry.hidden = false;
        });
        window.setTimeout(() => {
          if (!update()) {
            message.textContent = "The arena is taking longer than expected to start.";
            retry.hidden = false;
          }
        }, 15000);
      })();
    </script>    <script>
      (() => {
        const installWarmup = () => {
          const loading = document.querySelector("#loading");
          if (!loading || loading.querySelector(".rl2-warmup")) return;
          const warmup = document.createElement("section");
          warmup.className = "rl2-warmup";
          warmup.setAttribute("aria-label", "Ball timing warm-up");
          warmup.innerHTML = '<p class="rl2-warmup__title">KICKOFF WARM-UP</p><p class="rl2-warmup__hint" aria-live="polite">Tap the pitch when the ball reaches the blue target.</p><button class="rl2-warmup__track" type="button" aria-label="Tap when the ball reaches the blue target"><span class="rl2-warmup__target" aria-hidden="true"></span><span class="rl2-warmup__ball" aria-hidden="true">⚽</span></button><p class="rl2-warmup__score">Perfect touches: <span>0</span></p>';
          const hint = warmup.querySelector(".rl2-warmup__hint");
          const score = warmup.querySelector(".rl2-warmup__score span");
          const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const started = performance.now();
          let touches = 0;
          warmup.querySelector("button").addEventListener("click", () => {
            const phase = reducedMotion ? 0.64 : ((performance.now() - started) % 2300) / 2300;
            if (phase >= 0.58 && phase <= 0.75) {
              touches += 1;
              score.textContent = String(touches);
              hint.textContent = touches % 3 === 0 ? "Hat trick! Keep your timing sharp." : "Perfect touch! Go again.";
            } else {
              hint.textContent = phase < 0.58 ? "Wait for the ball to reach the blue target." : "Just missed it—time the next touch!";
            }
          });
          loading.append(warmup);
        };
        new MutationObserver(installWarmup).observe(document.documentElement, { childList: true, subtree: true });
        installWarmup();
      })();
    </script>
